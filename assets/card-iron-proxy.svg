"328.5" rx="20" fill="none" stroke="#1c221b"/><rect x=".75" y=".75" width="598.5" height="328.5" rx="20" fill="none" stroke="url(#cb)" stroke-width="1.5"/><text x="30" y="44" class="m" font-size="11" letter-spacing="2" fill="#7aa2ff">DEVELOPER TOOL · MIT</text><g transform="translate(30,58)"><rect width="248" height="22" rx="11" fill="#7aa2ff" fill-opacity=".12" stroke="#7aa2ff" stroke-opacity=".5"/><text x="124.0" y="15" text-anchor="middle" class="m" font-size="11" letter-spacing=".5" fill="#7aa2ff">OPEN SOURCE · INSIDE IRON JARVIS</text></g><text x="30" y="122" class="s" font-size="36" font-weight="800" letter-spacing="-1" fill="#eef0ea">Iron-Proxy</text><text x="30" y="151" class="s" font-size="17.5" font-weight="600" fill="#eef0ea" opacity=".9">All your AI subscriptions. Never hit a limit.</text><text x="30" y="177" class="s" font-size="15" fill="#9aa196">Ordered failover across your own accounts: it switches</text><text x="30" y="198" class="s" font-size="15" fill="#9aa196">mid-conversation when one runs out and back the moment it</text><text x="30" y="219" class="s" font-size="15" fill="#9aa196">resets. Now Iron Jarvis's account manager.</text><path d="M30 238.5H570" stroke="#1c221b"/><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1250;0.3750;1" dur="1.6s" fill="freeze"/><text x="30.0" y="272" class="s" font-size="28" font-weight="800" fill="#eef0ea">364</text><text x="30.0" y="292" class="m" font-size="11.5" letter-spacing="1" fill="#9aa196">TEST CASES</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2187;0.4688;1" dur="1.6s" fill="freeze"/><text x="210.0" y="272" class="s" font-size="28" font-weight="800" fill="#eef0ea">5</text><text x="210.0" y="292" class="m" font-size="11.5" letter-spacing="1" fill="#9aa196">PACKAGES</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3125;0.5625;1" dur="1.6s" fill="freeze"/><text x="390.0" y="272" class="s" font-