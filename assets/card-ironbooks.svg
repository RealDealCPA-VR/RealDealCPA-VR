"328.5" rx="20" fill="none" stroke="#1c221b"/><rect x=".75" y=".75" width="598.5" height="328.5" rx="20" fill="none" stroke="url(#cb)" stroke-width="1.5"/><text x="30" y="44" class="m" font-size="11" letter-spacing="2" fill="#b79cff">ACCOUNTING · OPEN SOURCE · MIT</text><g transform="translate(30,58)"><rect width="143" height="22" rx="11" fill="#b79cff" fill-opacity=".12" stroke="#b79cff" stroke-opacity=".5"/><text x="71.5" y="15" text-anchor="middle" class="m" font-size="11" letter-spacing=".5" fill="#b79cff">v1.3.0 · SHIPPING</text></g><text x="30" y="122" class="s" font-size="36" font-weight="800" letter-spacing="-1" fill="#eef0ea">Ironbooks</text><text x="30" y="151" class="s" font-size="17.5" font-weight="600" fill="#eef0ea" opacity=".9">QuickBooks Desktop power. Your machine. No subscription.</text><text x="30" y="177" class="s" font-size="15" fill="#9aa196">Double-entry books where the database itself refuses an</text><text x="30" y="198" class="s" font-size="15" fill="#9aa196">unbalanced entry. Imports a QuickBooks GL from PDF, and local AI</text><text x="30" y="219" class="s" font-size="15" fill="#9aa196">does the categorizing.</text><path d="M30 238.5H570" stroke="#1c221b"/><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1250;0.3750;1" dur="1.6s" fill="freeze"/><text x="30.0" y="272" class="s" font-size="28" font-weight="800" fill="#eef0ea">3,965</text><text x="30.0" y="292" class="m" font-size="11.5" letter-spacing="1" fill="#9aa196">TESTS</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2187;0.4688;1" dur="1.6s" fill="freeze"/><text x="210.0" y="272" class="s" font-size="28" font-weight="800" fill="#eef0ea">279K</text><text x="210.0" y="292" class="m" font-size="11.5" letter-spacing="1" fill="#9aa196">LINES OF TS</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3125;0.5625;1" dur="1.6s" fill="freeze"/><text x="390.0" y="272" class="s" font-size=