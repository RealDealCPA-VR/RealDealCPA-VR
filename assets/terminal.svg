<rect x=".5" y=".5" width="999" height="485" rx="16" fill="#0b0d0b" stroke="#1c221b"/><path d="M.5 40.5H999.5" stroke="#1c221b"/><circle cx="24" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="64" cy="21" r="6" fill="#28c840"/><text x="500.0" y="25" text-anchor="middle" class="m" font-size="12" fill="#5d6459">vr@realdealcpa: ~</text><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0972;0.0989;1" dur="6.17s" fill="freeze"/><text x="32" y="76" class="m" font-size="15" fill="#c8f560">$</text></g><clipPath id="tc0"><rect x="50.0" y="60" width="54.0" height="22"><animate attributeName="width" calcMode="discrete" values="0;0.0;9.0;18.0;27.0;36.0;45.0;54.0" keyTimes="0;0.1459;0.1532;0.1605;0.1677;0.1750;0.1823;0.1896" dur="6.17s" fill="freeze"/></rect></clipPath><text x="50.0" y="76" class="m" font-size="15" fill="#eef0ea" clip-path="url(#tc0)" textLength="54.0" lengthAdjust="spacingAndGlyphs">whoami</text><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2382;0.2707;1" dur="6.17s" fill="freeze"/><text x="32" y="101" class="m" font-size="15" xml:space="preserve" textLength="576.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#eef0ea">VR</tspan><tspan fill="#9aa196"> · CPA, builder, and the human in the loop behind </tspan><tspan fill="#c8f560">RealDealCPA</tspan><tspan fill="#9aa196">.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2577;0.2901;1" dur="6.17s" fill="freeze"/><text x="32" y="126" class="m" font-size="15" xml:space="preserve" textLength="711.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#9aa196">I build the software accounting firms wish existed, then make AI run it safely.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2771;0.2788;1" dur="6.17s" fill="freeze"/><text x="32" y="176" class="m" font-size="15" fill="#c8f560">$</text></g><clipPath id="tc4"><rect x="50.0" y="160" width="171.0" height="22"><animate attributeName="width" calcMode="discrete" values="0;0.0;9.0;18.0;27.0;36.0;45.0;54.0;63.0;72.0;81.0;90.0;99.0;108.0;117.0;126.0;135.0;144.0;153.0;162.0;171.0" keyTimes="0;0.3258;0.3331;0.3404;0.3476;0.3549;0.3622;0.3695;0.3768;0.3841;0.3914;0.3987;0.4060;0.4133;0.4206;0.4279;0.4352;0.4425;0.4498;0.4571;0.4643" dur="6.17s" fill="freeze"/></rect></clipPath><text x="50.0" y="176" class="m" font-size="15" fill="#eef0ea" clip-path="url(#tc4)" textLength="171.0" lengthAdjust="spacingAndGlyphs">cat ~/principles.md</text><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5130;0.5454;1" dur="6.17s" fill="freeze"/><text x="32" y="201" class="m" font-size="15" xml:space="preserve" textLength="657.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">▸ </tspan><tspan fill="#eef0ea">Local-first.  </tspan><tspan fill="#9aa196">Your data stays on your machine unless you say otherwise.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5324;0.5648;1" dur="6.17s" fill="freeze"/><text x="32" y="226" class="m" font-size="15" xml:space="preserve" textLength="567.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">▸ </tspan><tspan fill="#eef0ea">Fail-closed.  </tspan><tspan fill="#9aa196">An agent only gets the tools it was armed with.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5519;0.5843;1" dur="6.17s" fill="freeze"/><text x="32" y="251" class="m" font-size="15" xml:space="preserve" textLength="702.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">▸ </tspan><tspan fill="#eef0ea">Ask first.    </tspan><tspan fill="#9aa196">Risky steps wait for a human; code waits for an approved diff.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5713;0.6037;1" dur="6.17s" fill="freeze"/><text x="32" y="276" class="m" font-size="15" xml:space="preserve" textLength="567.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">▸ </tspan><tspan fill="#eef0ea">Prove it.     </tspan><tspan fill="#9aa196">A green suite is not proof. Drive the real app.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5908;0.5924;1" dur="6.17s" fill="freeze"/><text x="32" y="326" class="m" font-size="15" fill="#c8f560">$</text></g><clipPath id="tc10"><rect x="50.0" y="310" width="189.0" height="22"><animate attributeName="width" calcMode="discrete" values="0;0.0;9.0;18.0;27.0;36.0;45.0;54.0;63.0;72.0;81.0;90.0;99.0;108.0;117.0;126.0;135.0;144.0;153.0;162.0;171.0;180.0;189.0" keyTimes="0;0.6394;0.6467;0.6540;0.6613;0.6686;0.6759;0.6831;0.6904;0.6977;0.7050;0.7123;0.7196;0.7269;0.7342;0.7415;0.7488;0.7561;0.7634;0.7707;0.7780;0.7853;0.7925" dur="6.17s" fill="freeze"/></rect></clipPath><text x="50.0" y="326" class="m" font-size="15" fill="#eef0ea" clip-path="url(#tc10)" textLength="189.0" lengthAdjust="spacingAndGlyphs">jarvis status --fleet</text><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8412;0.8736;1" dur="6.17s" fill="freeze"/><text x="32" y="351" class="m" font-size="15" xml:space="preserve" textLength="648.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">● </tspan><tspan fill="#eef0ea">Iron Jarvis      </tspan><tspan fill="#5fe3ff">v1.302.0   </tspan><tspan fill="#9aa196">400 releases · 10,800+ tests      </tspan><tspan fill="#c8f560">shipping</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8606;0.8930;1" dur="6.17s" fill="freeze"/><text x="32" y="376" class="m" font-size="15" xml:space="preserve" textLength="648.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff8a3d">● </tspan><tspan fill="#eef0ea">Raster Studio    </tspan><tspan fill="#5fe3ff">rust       </tspan><tspan fill="#9aa196">558K lines · 6,534 tests          </tspan><tspan fill="#ff8a3d">building</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8801;0.9125;1" dur="6.17s" fill="freeze"/><text x="32" y="401" class="m" font-size="15" xml:space="preserve" textLength="639.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">● </tspan><tspan fill="#eef0ea">IronCore         </tspan><tspan fill="#5fe3ff">v0.3.2     </tspan><tspan fill="#9aa196">on PyPI · 2,740 offline tests     </tspan><tspan fill="#c8f560">shipped</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8995;0.9319;1" dur="6.17s" fill="freeze"/><text x="32" y="426" class="m" font-size="15" xml:space="preserve" textLength="639.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">● </tspan><tspan fill="#eef0ea">QuickBooks MCP   </tspan><tspan fill="#5fe3ff">v1.0.0     </tspan><tspan fill="#9aa196">150 tools · 1,725 tests           </tspan><tspan fill="#c8f560">shipped</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9190;0.9206;1" dur="6.17s" fill="freeze"/><text x="32" y="451" class="m" font-size="15" fill="#c8f560">$</text><rect x="50.0" y="437" width="9" height="18" fill="#c8f560"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/></rect></g>
