<rect x=".5" y=".5" width="999" height="510" rx="16" fill="#0b0d0b" stroke="#1c221b"/><path d="M.5 40.5H999.5" stroke="#1c221b"/><circle cx="24" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="64" cy="21" r="6" fill="#28c840"/><text x="500.0" y="25" text-anchor="middle" class="m" font-size="12" fill="#5d6459">vr@realdealcpa: ~</text><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0954;0.0970;1" dur="6.29s" fill="freeze"/><text x="32" y="76" class="m" font-size="15" fill="#c8f560">$</text></g><clipPath id="tc0"><rect x="50.0" y="60" width="54.0" height="22"><animate attributeName="width" calcMode="discrete" values="0;0.0;9.0;18.0;27.0;36.0;45.0;54.0" keyTimes="0;0.1431;0.1502;0.1574;0.1645;0.1717;0.1789;0.1860" dur="6.29s" fill="freeze"/></rect></clipPath><text x="50.0" y="76" class="m" font-size="15" fill="#eef0ea" clip-path="url(#tc0)" textLength="54.0" lengthAdjust="spacingAndGlyphs">whoami</text><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2337;0.2655;1" dur="6.29s" fill="freeze"/><text x="32" y="101" class="m" font-size="15" xml:space="preserve" textLength="576.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#eef0ea">VR</tspan><tspan fill="#9aa196"> · CPA, builder, and the human in the loop behind </tspan><tspan fill="#c8f560">RealDealCPA</tspan><tspan fill="#9aa196">.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2528;0.2846;1" dur="6.29s" fill="freeze"/><text x="32" y="126" class="m" font-size="15" xml:space="preserve" textLength="711.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#9aa196">I build the software accounting firms wish existed, then make AI run it safely.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2719;0.2734;1" dur="6.29s" fill="freeze"/><text x="32" y="176" class="m" font-size="15" fill="#c8f560">$</text></g><clipPath id="tc4"><rect x="50.0" y="160" width="171.0" height="22"><animate attributeName="width" calcMode="discrete" values="0;0.0;9.0;18.0;27.0;36.0;45.0;54.0;63.0;72.0;81.0;90.0;99.0;108.0;117.0;126.0;135.0;144.0;153.0;162.0;171.0" keyTimes="0;0.3196;0.3267;0.3339;0.3410;0.3482;0.3553;0.3625;0.3696;0.3768;0.3839;0.3911;0.3983;0.4054;0.4126;0.4197;0.4269;0.4340;0.4412;0.4483;0.4555" dur="6.29s" fill="freeze"/></rect></clipPath><text x="50.0" y="176" class="m" font-size="15" fill="#eef0ea" clip-path="url(#tc4)" textLength="171.0" lengthAdjust="spacingAndGlyphs">cat ~/principles.md</text><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5032;0.5350;1" dur="6.29s" fill="freeze"/><text x="32" y="201" class="m" font-size="15" xml:space="preserve" textLength="657.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">▸ </tspan><tspan fill="#eef0ea">Local-first.  </tspan><tspan fill="#9aa196">Your data stays on your machine unless you say otherwise.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5223;0.5541;1" dur="6.29s" fill="freeze"/><text x="32" y="226" class="m" font-size="15" xml:space="preserve" textLength="567.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">▸ </tspan><tspan fill="#eef0ea">Fail-closed.  </tspan><tspan fill="#9aa196">An agent only gets the tools it was armed with.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5413;0.5731;1" dur="6.29s" fill="freeze"/><text x="32" y="251" class="m" font-size="15" xml:space="preserve" textLength="702.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">▸ </tspan><tspan fill="#eef0ea">Ask first.    </tspan><tspan fill="#9aa196">Risky steps wait for a human; code waits for an approved diff.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5604;0.5922;1" dur="6.29s" fill="freeze"/><text x="32" y="276" class="m" font-size="15" xml:space="preserve" textLength="567.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">▸ </tspan><tspan fill="#eef0ea">Prove it.     </tspan><tspan fill="#9aa196">A green suite is not proof. Drive the real app.</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5795;0.5811;1" dur="6.29s" fill="freeze"/><text x="32" y="326" class="m" font-size="15" fill="#c8f560">$</text></g><clipPath id="tc10"><rect x="50.0" y="310" width="189.0" height="22"><animate attributeName="width" calcMode="discrete" values="0;0.0;9.0;18.0;27.0;36.0;45.0;54.0;63.0;72.0;81.0;90.0;99.0;108.0;117.0;126.0;135.0;144.0;153.0;162.0;171.0;180.0;189.0" keyTimes="0;0.6272;0.6343;0.6415;0.6486;0.6558;0.6630;0.6701;0.6773;0.6844;0.6916;0.6987;0.7059;0.7130;0.7202;0.7273;0.7345;0.7417;0.7488;0.7560;0.7631;0.7703;0.7774" dur="6.29s" fill="freeze"/></rect></clipPath><text x="50.0" y="326" class="m" font-size="15" fill="#eef0ea" clip-path="url(#tc10)" textLength="189.0" lengthAdjust="spacingAndGlyphs">jarvis status --fleet</text><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8251;0.8569;1" dur="6.29s" fill="freeze"/><text x="32" y="351" class="m" font-size="15" xml:space="preserve" textLength="648.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">● </tspan><tspan fill="#eef0ea">Iron Jarvis      </tspan><tspan fill="#5fe3ff">v1.399.2   </tspan><tspan fill="#9aa196">526 releases · 15,000+ tests      </tspan><tspan fill="#c8f560">shipping</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8442;0.8760;1" dur="6.29s" fill="freeze"/><text x="32" y="376" class="m" font-size="15" xml:space="preserve" textLength="648.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">● </tspan><tspan fill="#eef0ea">Ironbooks        </tspan><tspan fill="#5fe3ff">v1.6.0     </tspan><tspan fill="#9aa196">QB-class books · 3,965 tests      </tspan><tspan fill="#c8f560">shipping</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8633;0.8951;1" dur="6.29s" fill="freeze"/><text x="32" y="401" class="m" font-size="15" xml:space="preserve" textLength="648.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff8a3d">● </tspan><tspan fill="#eef0ea">Raster Studio    </tspan><tspan fill="#5fe3ff">rust       </tspan><tspan fill="#9aa196">558K lines · 6,534 tests          </tspan><tspan fill="#ff8a3d">building</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8824;0.9141;1" dur="6.29s" fill="freeze"/><text x="32" y="426" class="m" font-size="15" xml:space="preserve" textLength="639.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">● </tspan><tspan fill="#eef0ea">IronCore         </tspan><tspan fill="#5fe3ff">v0.3.2     </tspan><tspan fill="#9aa196">on PyPI · 2,740 offline tests     </tspan><tspan fill="#c8f560">shipped</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9014;0.9332;1" dur="6.29s" fill="freeze"/><text x="32" y="451" class="m" font-size="15" xml:space="preserve" textLength="639.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#c8f560">● </tspan><tspan fill="#eef0ea">QuickBooks MCP   </tspan><tspan fill="#5fe3ff">v1.0.0     </tspan><tspan fill="#9aa196">154 tools · 1,825 tests           </tspan><tspan fill="#c8f560">shipped</tspan></text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9205;0.9221;1" dur="6.29s" fill="freeze"/><text x="32" y="476" class="m" font-size="15" fill="#c8f560">$</text><rect x="50.0" y="462" width="9" height="18" fill="#c8f560"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/></rect></g>
