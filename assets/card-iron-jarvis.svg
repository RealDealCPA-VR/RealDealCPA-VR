ill="#eef0ea">15K+</text><text x="300.0" y="292" class="m" font-size="11.5" letter-spacing="1" fill="#9aa196">TESTS</text></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4062;0.6562;1" dur="1.6s" fill="freeze"/><text x="435.0" y="272" class="s" font-size="28" font-weight="800" fill="#eef0ea">868</text><text x="435.0" y="292" class="m" font-size="11.5" letter-spacing="1" fill="#9aa196">COMMITS</text></g><text x="30" y="317" class="m" font-size="12" fill="#5d6459">Python · FastAPI · Next.js · Electron · MCP</text><text x="570" y="317" text-anchor="end" class="m" font-size="12" letter-spacing="1" fill="#5fe3ff">REPO →</text>
